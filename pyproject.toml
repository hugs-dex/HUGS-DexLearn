# https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html
[tool.black]
line-length = 120
skip-magic-trailing-comma = false  # 保持默认
skip-string-normalization = false  # 保持默认
# 关键配置：让 Black 忽略注释长度
experimental-string-processing = false  # 禁用实验性字符串处理（可能影响注释换行）

# https://beta.ruff.rs/docs/settings/
[tool.ruff]
line-length = 120
# https://beta.ruff.rs/docs/rules/
select = ["E", "W", "F"]
ignore = ["F401"]
# Exclude a variety of commonly ignored directories.
respect-gitignore = true
ignore-init-module-imports = true

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexlearn"
version = "0.1.0"
description = "HUGS-DexLearn research-only source and contract release"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Research-only; see RESEARCH_ONLY.md"}
dependencies = ["hydra-core==1.3.2", "numpy>=1.26,<2"]

[project.optional-dependencies]
contract = ["pytest>=8,<9", "scipy>=1.14,<1.15"]
runtime = ["torch>=2.2,<2.3", "scipy>=1.14,<1.15", "wandb", "einops", "tqdm", "trimesh"]
visualize = ["trimesh", "viser", "pyglet<2", "opencv-python<4.12"]

[project.scripts]
dexlearn = "dexlearn.main:main"

[tool.setuptools.package-data]
dexlearn = ["config/*.yaml", "config/*/*.yaml", "scripts/*.sh"]

[tool.setuptools.packages.find]
include = ["dexlearn*"]
exclude = ["third_party*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["runtime: requires the documented CPU or GPU runtime dependencies"]
