# https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html
[tool.black]
line-length = 120
skip-magic-trailing-comma = false  # 保持默认
skip-string-normalization = false  # 保持默认
# 关键配置：让 Black 忽略注释长度
experimental-string-processing = false  # 禁用实验性字符串处理（可能影响注释换行）

# https://beta.ruff.rs/docs/settings/
[tool.ruff]
line-length = 120
# https://beta.ruff.rs/docs/rules/
select = ["E", "W", "F"]
ignore = ["F401"]
# Exclude a variety of commonly ignored directories.
respect-gitignore = true
ignore-init-module-imports = true

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexlearn"
version = "0.1.0"
description = "HUGS-DexLearn research-only source and contract release"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Research-only; see RESEARCH_ONLY.md"}
dependencies = ["hydra-core==1.3.2", "numpy==1.26.4"]

[project.optional-dependencies]
contract = ["pytest>=8,<9", "scipy==1.14.1"]
# Install before the extensions: their setup scripts import torch and use pip.
build = ["torch==2.2.2", "setuptools==75.8.2", "wheel", "ninja", "pip", "build"]
runtime = [
    "torch==2.2.2", "scipy==1.14.1", "wandb>=0.19,<0.20", "einops", "tqdm",
    "trimesh>=4.6,<5", "nflows", "diffusers", "huggingface-hub>=0.27,<1",
    "pytorch3d==0.7.8", "iopath", "fvcore",
]
cuda = ["MinkowskiEngine==0.5.4"]
visualize = [
    "trimesh>=4.6,<5", "viser", "pyglet<2", "opencv-python<4.12",
    "manopth", "chumpy==0.70", "pytorch-kinematics", "mingrui-utils-python",
]

[tool.uv]
no-build-isolation-package = ["pytorch3d", "minkowskiengine", "chumpy"]

[tool.uv.sources]
nflows = { path = "third_party/nflows" }
diffusers = { path = "third_party/diffusers" }
manopth = { path = "third_party/manopth" }
pytorch-kinematics = { path = "third_party/pytorch_kinematics" }
mingrui-utils-python = { path = "third_party/utils_python", editable = true }
minkowskiengine = { path = "third_party/MinkowskiEngine" }
# Official V0.7.8 release; build a wheel against this environment's PyTorch.
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "75ebeeaea0908c5527e7b1e305fbc7681382db47" }

[tool.uv.config-settings-package]
minkowskiengine = { "--global-option" = "--blas=openblas" }

[tool.uv.extra-build-variables]
pytorch3d = { MAX_JOBS = "4" }
minkowskiengine = { MAX_JOBS = "4" }

[project.scripts]
dexlearn = "dexlearn.main:main"

[tool.setuptools.package-data]
dexlearn = ["config/*.yaml", "config/*/*.yaml"]

[tool.setuptools.packages.find]
include = ["dexlearn*"]
exclude = ["third_party*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["runtime: requires the documented CPU or GPU runtime dependencies"]
